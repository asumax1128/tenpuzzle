<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>テンパズル v0.3</title>
<style>
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2430; --sub:#6b7080; --line:#e3ddd0;
  --accent:#e2552d; --accent-ink:#ffffff; --sel:#ffd34d; --ok:#2f9e5b; --ng:#c8382b;
  --gold:#c99a2e; --gold-bg:#fff6dc; --chip:#efe9dc; --card:#fffdf8; --shadow:0 2px 0 rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181d; --panel:#21242b; --ink:#eef0f4; --sub:#9aa0ad; --line:#343844;
    --accent:#ff7a4d; --accent-ink:#1a1a1a; --sel:#e3b53a; --ok:#4cc27e; --ng:#ff6b5e;
    --gold:#e6bb4f; --gold-bg:#3a3220; --chip:#2c3039; --card:#272b33; --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16181d; --panel:#21242b; --ink:#eef0f4; --sub:#9aa0ad; --line:#343844;
  --accent:#ff7a4d; --accent-ink:#1a1a1a; --sel:#e3b53a; --ok:#4cc27e; --ng:#ff6b5e;
  --gold:#e6bb4f; --gold-bg:#3a3220; --chip:#2c3039; --card:#272b33; --shadow:0 2px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-tap-highlight-color:transparent;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:disabled{cursor:default;opacity:.4}
#app{max-width:480px;margin:0 auto;padding:12px 16px 32px;min-height:100vh}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.wide{width:100%;padding:14px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.sub{color:var(--sub);font-size:.85rem}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}

/* タイトル */
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12vh;text-align:center}
.logo{font-size:2.6rem;font-weight:900;letter-spacing:.06em}
.logo b{color:var(--accent)}
.tag{color:var(--sub)}
.stats{display:flex;gap:10px;width:100%}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat .v{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.title-btns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}

/* ヘッダ */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar .grow{flex:1;min-width:0}
.bar h2{margin:0;font-size:1.15rem}

/* 図鑑 */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sec-h .name{font-weight:800}
.sec-h .cnt{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums;font-size:.9rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 4px 4px;text-align:center;min-height:56px}
.tile .d{font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;font-size:1.05rem}
.tile .s{font-size:.72rem;color:var(--sub);white-space:nowrap}
.tile .stars{color:var(--gold);letter-spacing:.05em}
.tile.gold{border:2px solid var(--gold);background:var(--gold-bg)}
.tile.wip::after{content:"途中";position:absolute;top:-6px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:.62rem;padding:0 5px;border-radius:6px}
.stamp{display:inline-block;border:2px solid var(--ng);color:var(--ng);border-radius:6px;padding:0 4px;font-size:.7rem;font-weight:800;transform:rotate(-6deg)}
.grp{border-top:1px dashed var(--line)}
.grp:first-of-type{border-top:none}
.grp-h{display:flex;width:100%;align-items:center;padding:8px 2px;font-weight:700}
.grp-h .cnt{margin-left:auto;color:var(--sub);font-weight:500;font-size:.85rem}
.grp-h .arrow{display:inline-block;width:1.1em;transition:transform .15s}
.grp.open .arrow{transform:rotate(90deg)}
.grp .tiles{padding-bottom:8px}

/* プレイ */
.play-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.play-head .digits{font-size:1.5rem;font-weight:900;letter-spacing:.2em;flex:1;text-align:center}
.score-mini{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--sub);text-align:right;min-width:64px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0 14px;min-height:112px;align-items:center}
.card{position:relative;width:76px;height:100px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 22%,var(--card));transform:translateY(-4px)}
.card .ord{position:absolute;top:-9px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--sel);color:#1a1a1a;font-size:.75rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.card .num{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums}
.frac .fn{border-bottom:2px solid currentColor;padding:0 3px}
.card .frac{font-size:1.45rem}
.frac-wrap{display:inline-flex;align-items:center;gap:2px}
.card .approx{font-size:.68rem;color:var(--sub);margin-top:4px}
.card.won{border-color:var(--ok)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op{border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.op .sym{font-size:1.5rem;font-weight:900;line-height:1}
.op .pv{font-size:.75rem;color:var(--sub);margin-top:2px;white-space:nowrap}
.op.bad .pv{color:var(--ng)}
.swap-row{display:flex;justify-content:center;margin:8px 0}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.declare{margin-top:10px;border:2px dashed var(--ng);color:var(--ng);background:transparent;box-shadow:none}
.msg{min-height:1.6em;text-align:center;font-weight:700;margin-top:4px}
.msg.ng{color:var(--ng)} .msg.ok{color:var(--ok)}
.hints{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.92rem}
.hints p{margin:4px 0}
.hints .note{font-size:.75rem;color:var(--sub)}

/* 結果 */
.res{text-align:center;padding-top:4vh}
.res h2{font-size:1.8rem;margin:.2em 0}
.res .expr{font-size:1.6rem;font-weight:900;margin:8px 0 2px;letter-spacing:.03em;word-break:break-all}
.res .big-stars{font-size:2rem;color:var(--gold);letter-spacing:.1em}
.breakdown{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0;text-align:left}
.breakdown .ln{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.breakdown .ln.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:800}
.newsol{font-weight:800;color:var(--accent)}
.techs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.big-stamp{display:inline-block;border:4px solid var(--ng);color:var(--ng);border-radius:12px;padding:4px 14px;font-size:1.6rem;font-weight:900;transform:rotate(-8deg);margin:10px 0}
.res .btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}

/* v0.3：データ・設定・操作方法A */
.data-row{display:flex;gap:8px;width:100%}
.data-row .btn{flex:1;font-size:.9rem;padding:9px 8px}
.tmsg{min-height:1.4em;font-weight:700;font-size:.9rem}
.tmsg.ng{color:var(--ng)} .tmsg.ok{color:var(--ok)}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.opt.on{border-color:var(--accent)}
.opt .h{font-weight:800;display:flex;align-items:center;gap:8px}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--sub);display:inline-block;flex:none}
.opt.on .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.opt .sub{margin-top:4px}
.expr-box{text-align:center;font-size:1.6rem;font-weight:900;min-height:2.2rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.guide{text-align:center;color:var(--sub);font-weight:700;margin-bottom:8px}
.op.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.mode-chip{font-size:.7rem}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center}
.modal p{margin:6px 0 14px;font-weight:700;font-size:1.1rem}
</style>
</head>

  // ---- 描画 ----
  function render() {
    var h = '';
    if (ui.screen === 'title') h = renderTitle();
    else if (ui.screen === 'zukan') h = renderZukan();
    else if (ui.screen === 'play') h = renderPlay();
    else if (ui.screen === 'result') h = renderResult();
    else if (ui.screen === 'settings') h = renderSettings();
    if (ui.modal) h += renderModal();
    app.innerHTML = h;
  }
  function renderTitle() {
    var done = TP.resolvedCount(POOL, save);
    return '<div class="title-wrap">' +
      '<div class="logo">テン<b>パズル</b></div>' +
      '<div class="tag">4つの数で 10 をつくろう</div>' +
      '<div class="stats">' +
      '<div class="stat"><div class="sub">解決済み</div><div class="v" id="t-progress">' + done + '<span class="sub"> / ' + POOL.length + '組</span></div></div>' +
      '<div class="stat"><div class="sub">累計スコア</div><div class="v" id="t-total">' + save.total + '</div></div>' +
      '</div>' +
      '<div class="title-btns">' +
      '<button class="btn primary wide" data-act="play">あそぶ</button>' +
      '<button class="btn wide" data-act="zukan">図鑑</button>' +
      '<button class="btn wide" data-act="settings">設定<span class="chip mode-chip">操作方法' + (modeA() ? 'A' : 'B') + '</span></button>' +
      '<div class="data-row">' +
      '<button class="btn" data-act="export">データ書き出し</button>' +
      '<button class="btn" data-act="import">データ読み込み</button>' +
      '</div>' +
      '</div>' +
      '<div class="tmsg ' + ui.titleMsgKind + '" id="t-msg">' + esc(ui.titleMsg) + '</div>' +
      '<div class="sub">v0.3 試作 ・ 記録はこの端末に保存されます</div>' +
      '</div>';
  }
  function renderSettings() {
    function opt(m, title, desc) {
      var on = settings.controlMode === m;
      return '<button class="opt' + (on ? ' on' : '') + '" data-act="set-mode" data-mode="' + m + '"><div class="h"><span class="dot"></span>' + title + (m === 'A' ? '<span class="chip">標準</span>' : '') + '</div><div class="sub">' + desc + '</div></button>';
    }
    return '<div class="bar"><button class="btn" data-act="title">← 戻る</button><div class="grow"><h2>設定</h2></div></div>' +
      '<div class="sec"><div class="sec-h"><span class="name">操作方法</span></div>' +
      opt('A', '操作方法A　数字 → 記号 → 数字', '数字を1つえらび、記号をえらんで、もう1つの数字をタップすると合体。−と÷は先にえらんだ数字が左。⇄で向きを入れ替え') +
      opt('B', '操作方法B　数字2枚 → 記号', '数字を2枚えらんでから記号をタップすると合体。1枚目が左。記号ボタンに結果が出る') +
      '<div class="sub">設定はこの端末に保存されます（データ書き出しには含まれません）</div></div>';
  }
  function tileHTML(key) {
    var e = BY[key], r = TP.peekRec(save, key), t = TP.tileInfo(e, r);
    var cls = 'tile' + (t.gold ? ' gold' : '') + (t.wip ? ' wip' : '');
    var s = '';
    if (t.state === 'solved') s = '<div class="s"><span class="stars">' + starStr(t.stars) + '</span> ' + t.found + '/' + t.total + '通り</div>';
    else if (t.state === 'declared') s = '<div class="s"><span class="stamp">見極め</span></div>';
    else s = '<div class="s">未挑戦</div>';
    if (t.state === 'unknown' && r && r.tries) s = '<div class="s">挑戦中</div>';
    return '<button class="' + cls + '" data-act="open" data-key="' + key + '"><div class="d">' + e.digits.join('') + '</div>' + s + '</button>';
  }
  function renderZukan() {
    var z = TP.zukanSections(POOL, save);
    var h = '<div class="bar"><button class="btn" data-act="title">← 戻る</button><div class="grow"><h2>図鑑</h2></div>' +
      '<span class="chip">' + TP.resolvedCount(POOL, save) + ' / ' + POOL.length + '組</span></div>';
    // 未判定
    h += '<div class="sec"><div class="sec-h"><span class="name">未判定</span><span class="sub">ティアは解くと判明</span><span class="cnt">残り ' + z.unknownCount + '組</span></div>';
    if (!z.unknownCount) h += '<div class="sub">すべて判定済み！</div>';
    z.unknown.forEach(function (g) {
      var open = !!ui.open[g.min];
      h += '<div class="grp' + (open ? ' open' : '') + '"><button class="grp-h" data-act="grp" data-min="' + g.min + '"><span class="arrow">▶</span>' + g.min + ' から始まる組<span class="cnt">解決 ' + g.resolved + '/' + g.total + '</span></button>';
      if (open) h += g.keys.length ? '<div class="tiles">' + g.keys.map(tileHTML).join('') + '</div>' : '<div class="sub" style="padding-bottom:8px">このグループはすべて判定済み</div>';
      h += '</div>';
    });
    h += '</div>';
    // ティア別
    z.tiers.forEach(function (t) {
      h += '<div class="sec"><div class="sec-h"><span class="name">' + t.name + '</span>' +
        (t.name === TP.UNSOLVABLE ? '<span class="sub">見極めた組</span>' : '<span class="sub">基本 ' + TP.BASE[t.name] + '点</span>') +
        '<span class="cnt">' + t.keys.length + ' / ' + t.total + '組</span></div>';
      h += t.keys.length ? '<div class="tiles">' + t.keys.map(tileHTML).join('') + '</div>' : '<div class="sub">まだありません</div>';
      h += '</div>';
    });
    return h;
  }
  function renderPlay() {
    var e = BY[ui.key], r = TP.peekRec(save, ui.key);
    var b = ui.board;
    var h = '<div class="play-head"><button class="btn" data-act="zukan">図鑑</button>' +
      '<span class="chip" id="p-tier">' + TP.tierLabel(e, r) + '</span>' +
      '<div class="digits">' + e.digits.join(' ') + '</div>' +
      '<div class="score-mini">累計<br><span id="p-total">' + save.total + '</span></div></div>';
    h += '<div class="cards">';
    var A = modeA();
    b.cards.forEach(function (c, i) {
      var si = A ? (ui.a.first === i ? 0 : -1) : ui.sel.indexOf(i);
      var won = b.cards.length === 1 && TP.isWin(b);
      h += '<button class="card' + (si >= 0 ? ' sel' : '') + (won ? ' won' : '') + '" data-act="card" data-i="' + i + '">' +
        (si >= 0 ? '<span class="ord">' + (si + 1) + '</span>' : '') + fracHTML(c.v) +
        (c.v.d !== 1 ? '<span class="approx">≈' + TP.approx(c.v) + '</span>' : '') + '</button>';
    });
    h += '</div>';
    if (A) {
      // 操作方法A：入力中の式と案内文、記号は入力待ち表示、⇄は記号の入力待ち中のみ
      h += '<div class="expr-box" id="p-expr">' + esc(TP.aExpr(ui.a, b)) + '</div>';
      h += '<div class="guide" id="p-guide">' + TP.aGuide(ui.a) + '</div>';
      h += '<div class="ops">';
      ['+', '-', '*', '/'].forEach(function (op) {
        var on = ui.a.op === op;
        h += '<button class="op' + (on ? ' on' : '') + '" data-act="op" data-op="' + op + '"' + (ui.a.first === null ? ' disabled' : '') + '><span class="sym">' + TP.pretty(TP.SYM[op]) + '</span></button>';
      });
      h += '</div>';
      h += '<div class="swap-row"><button class="btn" data-act="swap"' + (ui.a.op !== null ? '' : ' disabled') + '>⇄ 向きを入れ替え</button></div>';
      return renderPlayTools(h, e, r, b);
    }
    var two = ui.sel.length === 2;
    h += '<div class="ops">';
    ['+', '-', '*', '/'].forEach(function (op) {
      var pv = '', bad = false;
      if (two) {
        var p = TP.preview(b, ui.sel[0], ui.sel[1], op);
        var A = TP.fracStr(b.cards[ui.sel[0]].v), B = TP.fracStr(b.cards[ui.sel[1]].v);
        if (p.ok) pv = TP.pretty(A + ' ' + TP.SYM[op] + ' ' + B + ' = ' + TP.fracStr(p.v));
        else { pv = '0では割れません'; bad = true; }
      } else pv = ui.sel.length ? 'もう1枚えらぶ' : 'カードを2枚えらぶ';
      h += '<button class="op' + (bad ? ' bad' : '') + '" data-act="op" data-op="' + op + '"' + (two ? '' : ' disabled') + '><span class="sym">' + TP.pretty(TP.SYM[op]) + '</span><span class="pv">' + esc(pv) + '</span></button>';
    });
    h += '</div>';
    h += '<div class="swap-row"><button class="btn" data-act="swap"' + (two ? '' : ' disabled') + '>⇄ 1枚目と2枚目を入れ替え</button></div>';
    return renderPlayTools(h, e, r, b);
  }
  function renderPlayTools(h, e, r, b) {
    h += '<div class="msg ' + ui.msgKind + '" id="p-msg">' + esc(ui.msg) + '</div>';
    var hints = TP.hintsFor(e), used = r ? r.hintsUsed : 0;
    h += '<div class="tools">' +
      '<button class="btn" data-act="undo"' + (b.history.length ? '' : ' disabled') + '>↶ 1手戻す</button>' +
      '<button class="btn" data-act="reset"' + (b.history.length ? '' : ' disabled') + '>リセット</button>' +
      '<button class="btn" data-act="hint"' + (used < hints.length ? '' : ' disabled') + '>ヒント ' + used + '/' + hints.length + '</button>' +
      '</div>';
    h += '<button class="btn wide declare" data-act="declare">「10は作れません」と宣言する</button>';
    if (used) {
      h += '<div class="hints" id="p-hints">';
      for (var k = 0; k < used; k++) h += '<p><b>ヒント' + (k + 1) + '</b>　' + esc(hints[k].text) + '</p>';
      if (e.solvable) h += '<p class="note">※ある解き方の1手目です。いまの盤面と違う道でもOK</p>';
      else h += '<p class="note">※ヒントを見てからの宣言成功は ' + TP.SCORE.declareWithHint + '点</p>';
      h += '</div>';
    }
    return h;
  }
  function renderResult() {
    var R = ui.result, h = '<div class="res">';
    if (R.kind === 'solve') {
      h += '<h2>10 できた！</h2>';
      h += '<div class="expr" id="r-expr">' + esc(TP.pretty(R.expr)) + ' = 10</div>';
      h += '<div class="big-stars">' + starStr(R.stars) + '</div>';
      h += '<div class="techs">' + (R.fraction ? '<span class="chip">分数経由</span>' : '') + (R.distinctOps ? '<span class="chip">全部ちがう演算</span>' : '') +
        (R.gold ? '<span class="chip" style="background:var(--gold-bg);color:var(--gold)">分数必須の組</span>' : '') + '</div>';
      h += R.isNew ? '<div class="newsol" id="r-new">新しい解法！ これで ' + R.foundCount + '/' + R.nSolutions + ' 通り</div>'
        : '<div class="sub" id="r-new">この解法は発見済み（' + R.foundCount + '/' + R.nSolutions + ' 通り）</div>';
      h += '<div class="breakdown">' +
        '<div class="ln"><span>基本点（' + BY[R.key].tier + '）</span><span>' + R.base + '</span></div>' +
        (R.gold ? '<div class="ln"><span>分数必須の組</span><span>+' + R.gold + '</span></div>' : '') +
        (R.fraction ? '<div class="ln"><span>分数経由</span><span>+' + TP.SCORE.fraction + '</span></div>' : '') +
        (R.distinctOps ? '<div class="ln"><span>全部ちがう演算</span><span>+' + TP.SCORE.distinctOps + '</span></div>' : '') +
        (R.isNew ? '<div class="ln"><span>新しい解法</span><span>+' + R.newBonus + '</span></div>' : '') +
        '<div class="ln tot"><span>今回の得点</span><span>' + R.attempt + '</span></div>' +
        '<div class="ln"><span class="sub">累計に加算（ベスト更新分＋新解法）</span><span id="r-delta">+' + R.delta + '</span></div>' +
        '<div class="ln"><span class="sub">累計スコア</span><span>' + R.total + '</span></div>' +
        '</div>';
      h += '<div class="btns"><button class="btn primary wide" data-act="next">次の組へ</button><button class="btn wide" data-act="again">この組をもう一度</button><button class="btn wide" data-act="zukan">図鑑へ</button></div>';
    } else if (R.kind === 'declare' && R.success) {
      h += '<h2>見極め成功！</h2><div class="big-stamp">見極め</div>';
      h += '<div class="breakdown"><div class="ln"><span>宣言成功' + (R.hintsUsed ? '（ヒント使用）' : '') + '</span><span>' + R.points + '</span></div>' +
        '<div class="ln"><span class="sub">累計に加算</span><span id="r-delta">+' + R.delta + '</span></div>' +
        '<div class="ln"><span class="sub">累計スコア</span><span>' + R.total + '</span></div></div>';
      h += '<div class="btns"><button class="btn primary wide" data-act="next">次の組へ</button><button class="btn wide" data-act="zukan">図鑑へ</button></div>';
    } else {
      h += '<h2 style="color:var(--ng)">宣言失敗…</h2><p>この組は 10 を<b>作れます</b>。<br>今回の挑戦は終了（0点）。</p><p class="sub">組は未解決のまま残ります。もう一度考えてみよう。</p>';
      h += '<div class="btns"><button class="btn primary wide" data-act="again">もう一度挑戦</button><button class="btn wide" data-act="next">次の組へ</button><button class="btn wide" data-act="zukan">図鑑へ</button></div>';
    }
    return h + '</div>';
  }
  function renderModal() {
    if (ui.modal === 'import') {
      var cur = TP.saveSummary(save, POOL), nw = TP.saveSummary(ui.pendingImport, POOL);
      return '<div class="modal-bg"><div class="modal"><p>記録を上書きしますか？</p>' +
        '<div class="sub" style="margin-bottom:14px" id="m-import">いまの記録：解決 ' + cur.resolved + '組・' + cur.total + '点<br>読み込む記録：解決 ' + nw.resolved + '組・' + nw.total + '点</div>' +
        '<div class="row"><button class="btn" data-act="import-no">やめる</button><button class="btn primary" data-act="import-yes">上書きする</button></div></div></div>';
    }
    return '<div class="modal-bg"><div class="modal"><p>本当に10は作れませんか？</p>' +
      '<div class="row"><button class="btn" data-act="modal-no">考え直す</button><button class="btn primary" data-act="modal-yes">宣言する</button></div></div></div>';
  }

  // ---- 操作 ----
  function setMsg(m, kind) { ui.msg = m; ui.msgKind = kind || ''; }
  function onCard(i) {
    var at = ui.sel.indexOf(i);
    if (at >= 0) ui.sel.splice(at, 1);
    else if (ui.sel.length < 2) ui.sel.push(i);
    else ui.sel = [i];
    setMsg('');
    SFX.tap();
    render();
  }
  // 操作方法A：カードのタップ
  function onCardA(i) {
    var r = TP.aTapCard(ui.a, ui.board, i);
    if (r.type === 'blocked') {
      setMsg(r.error === 'divzero' ? '0 で割ることはできません。別の数字をえらんでください' : 'えらび直してください', 'ng');
      SFX.bad(); render(); return;
    }
    setMsg('');
    if (r.type === 'merge') { afterMerge(); return; }
    SFX.tap();
    render();
  }
  function onOp(op) {
    if (modeA()) { if (TP.aTapOp(ui.a, op)) { setMsg(''); SFX.tap(); render(); } return; }
    if (ui.sel.length !== 2) return;
    var res = TP.merge(ui.board, ui.sel[0], ui.sel[1], op);
    if (!res.ok) {
      setMsg(res.error === 'divzero' ? '0 で割ることはできません' : 'カードを2枚えらんでください', 'ng');
      SFX.bad(); render(); return;
    }
    ui.sel = [];
    setMsg('');
    afterMerge();
  }
  function afterMerge() {
    if (TP.isFinished(ui.board)) {
      if (TP.isWin(ui.board)) {
        var e = BY[ui.key];
        var R = TP.solve(save, e, ui.board.cards[0].e);
        R.kind = 'solve';
        persist();
        ui.result = R;
        SFX.win();
        ui.screen = 'result';
        render();
        return;
      }
      setMsg(TP.fracStr(ui.board.cards[0].v) + ' になりました。1手戻すかリセット', 'ng');
      SFX.bad();
    } else SFX.pop();
    saveProgress();
    render();
  }
  function handle(act, el) {
    var ds = (el && el.dataset) || {};
    switch (act) {
      case 'title': go('title'); break;
      case 'zukan': go('zukan'); break;
      case 'play': openSet(TP.pickPlay(POOL, save)); break;
      case 'open': openSet(ds.key); break;
      case 'grp': ui.open[ds.min] = !ui.open[ds.min]; render(); break;
      case 'card': if (modeA()) onCardA(parseInt(ds.i, 10)); else onCard(parseInt(ds.i, 10)); break;
      case 'op': onOp(ds.op); break;
      case 'swap':
        if (modeA()) { if (TP.aFlip(ui.a)) { setMsg(''); render(); } }
        else if (ui.sel.length === 2) { ui.sel.reverse(); render(); }
        break;
      case 'undo': if (TP.undo(ui.board)) { ui.sel = []; TP.clearInputA(ui.a); setMsg(''); saveProgress(); render(); } break;
      case 'reset': TP.reset(ui.board, BY[ui.key].digits); ui.sel = []; TP.clearInputA(ui.a); setMsg(''); saveProgress(); render(); break;
      case 'settings': ui.titleMsg = ''; go('settings'); break;
      case 'set-mode':
        settings.controlMode = ds.mode === 'B' ? 'B' : 'A';
        TP.writeSettings(store, settings);
        render();
        break;
      case 'export': doExport(); break;
      case 'import': {
        var inp = document.getElementById('import-file');
        if (inp) { inp.value = ''; inp.click(); }
        break;
      }
      case 'import-no': ui.modal = null; ui.pendingImport = null; setTitleMsg('読み込みをやめました（記録はそのままです）', ''); render(); break;
      case 'import-yes': {
        var ns = ui.pendingImport;
        ui.modal = null; ui.pendingImport = null;
        if (ns) {
          save = ns;
          persist();
          setTitleMsg('読み込みました（解決 ' + TP.resolvedCount(POOL, save) + '組・' + save.total + '点）', 'ok');
        }
        render();
        break;
      }
      case 'hint': if (TP.useHint(save, BY[ui.key])) { persist(); render(); } break;
      case 'declare': ui.modal = 'declare'; render(); break;
      case 'modal-no': ui.modal = null; render(); break;
      case 'modal-yes': {
        ui.modal = null;
        var R = TP.declare(save, BY[ui.key]);
        R.kind = 'declare';
        persist();
        ui.board = TP.newBoard(BY[ui.key].digits);
        ui.result = R;
        if (R.success) SFX.win(); else SFX.bad();
        ui.screen = 'result';
        render();
        break;
      }
      case 'next': openSet(TP.pickNext(POOL, save, ui.key)); break;
      case 'again': openSet(ui.key); break;
    }
  }
  function setTitleMsg(m, kind) { ui.titleMsg = m; ui.titleMsgKind = kind || ''; }
  function exportText() { return TP.exportSave(save); }
  function doExport() {
    try {
      var text = exportText();
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = TP.exportFileName();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      setTitleMsg('記録を書き出しました（' + a.download + '）', 'ok');
    } catch (err) {
      setTitleMsg('書き出しに失敗しました', 'ng');
    }
    render();
  }
  // 読み込み：検証に通ったら確認ダイアログ。失敗時は既存データに触れずメッセージのみ
  function importText(text) {
    var r = TP.parseImport(text, POOL);
    if (!r.ok) {
      ui.pendingImport = null;
      setTitleMsg('読み込めませんでした：' + r.error + '（いまの記録はそのままです）', 'ng');
      SFX.bad();
    } else {
      ui.pendingImport = r.save;
      ui.modal = 'import';
      setTitleMsg('', '');
    }
    ui.screen = 'title';
    render();
    return r;
  }
  var fileInput = document.getElementById('import-file');
  if (fileInput && fileInput.addEventListener) {
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      if (f.size > 5000000) { setTitleMsg('読み込めませんでした：ファイルが大きすぎます（いまの記録はそのままです）', 'ng'); render(); return; }
      var rd = new FileReader();
      rd.onload = function () { importText(String(rd.result || '')); };
      rd.onerror = function () { setTitleMsg('読み込めませんでした：ファイルを開けません（いまの記録はそのままです）', 'ng'); render(); };
      rd.readAsText(f);
    });
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    handle(el.getAttribute('data-act'), el);
  });

  // テスト・デバッグ用の窓口
  window.__TP_UI = { ui: ui, getSave: function () { return save; }, getSettings: function () { return settings; },
    handle: handle, render: render, POOL: POOL, exportText: exportText, importText: importText };
  render();
})();
</script>
</body>
</html>
